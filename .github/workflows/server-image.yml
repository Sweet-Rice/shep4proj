name: Server image

on:
  push:
    branches: [main]
    paths:
      - apps/server/**
      - packages/shared/**
      - packages/scraper/**
      - data/degrees/**
      - pnpm-lock.yaml
      - package.json
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - .github/workflows/server-image.yml
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sweet-rice/shep4proj-server
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.source=https://github.com/Sweet-Rice/shep4proj

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    if: vars.RENDER_SERVICE_URL != ''
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Migrate production database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          IMAGE_REF: ghcr.io/sweet-rice/shep4proj-server@${{ needs.publish.outputs.digest }}
        run: docker run --rm -e DATABASE_URL "$IMAGE_REF" node docker/migrate.mjs

      - name: Deploy image to Render
        env:
          IMAGE_REF: ghcr.io/sweet-rice/shep4proj-server@${{ needs.publish.outputs.digest }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          encoded_image=$(node -e 'process.stdout.write(encodeURIComponent(process.env.IMAGE_REF))')
          curl -fsS "${RENDER_DEPLOY_HOOK_URL}&imgURL=${encoded_image}" -o /dev/null

      - name: Wait for service health
        env:
          RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
        run: |
          for _ in $(seq 1 96); do
            if curl -fsS -o /dev/null "${RENDER_SERVICE_URL}/health"; then
              exit 0
            fi
            sleep 5
          done
          echo "Render service did not become healthy within 8 minutes" >&2
          exit 1
