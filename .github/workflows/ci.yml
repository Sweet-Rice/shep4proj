name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://jevschedule:jevschedule@localhost:5432/jevschedule
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: jevschedule
          POSTGRES_PASSWORD: jevschedule
          POSTGRES_DB: jevschedule
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jevschedule -d jevschedule"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Needed so gitleaks can scan full history / the diff.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -r lint

      # Build before typecheck: consumers (apps/server, apps/desktop) import
      # @jevschedule/shared, and `tsc --noEmit` needs its built declaration
      # files to resolve the workspace dependency.
      - name: Build
        run: pnpm -r build

      - name: Prereq coverage report
        run: pnpm --filter @jevschedule/shared coverage:prereqs

      - name: Typecheck
        run: pnpm -r typecheck

      # Built before the migrate steps so the database is migrated from the image itself.
      - name: Build server image
        run: docker build -f apps/server/Dockerfile -t jevschedule-server:ci .

      # migrate.mjs must never print DATABASE_URL, which holds the password. An unencoded
      # `#` in the password makes the URL unparsable, and the parser's error carries it.
      - name: Check production migrator hides DATABASE_URL
        run: |
          if out=$(docker run --rm --network none \
            -e DATABASE_URL='postgres://u:SENTINEL#x@h:5432/db' \
            jevschedule-server:ci node docker/migrate.mjs 2>&1); then
            echo "migrate.mjs exited 0 with an invalid DATABASE_URL" >&2
            exit 1
          fi
          echo "$out"
          if grep -q SENTINEL <<<"$out"; then
            echo "migrate.mjs printed DATABASE_URL" >&2
            exit 1
          fi
          if ! grep -q ERR_INVALID_URL <<<"$out"; then
            echo "migrate.mjs didn't report ERR_INVALID_URL" >&2
            exit 1
          fi

      # The production image migrates with migrate.mjs (no drizzle-kit). Running it from
      # the image checks the script, the migrations and their dependencies all ship in it.
      # Running it first makes the drizzle-kit step below a compatibility check: if the two
      # disagreed on the migrations table, drizzle-kit would re-run the migrations and fail.
      - name: Migrate database (production migrator)
        run: >-
          docker run --rm --network host -e DATABASE_URL="$DATABASE_URL"
          jevschedule-server:ci node docker/migrate.mjs

      - name: Migrate database
        run: pnpm --filter @jevschedule/server db:migrate

      - name: Seed database from fixtures
        run: pnpm --filter @jevschedule/server db:seed:fixtures

      - name: Test
        run: pnpm -r test

      # Checks the production image serves /health against the CI database. The port is
      # published rather than shared with --network host, so a server that only listens on
      # the container's loopback fails here as it would in production. The container
      # reaches the Postgres service through the runner's published 5432. The section
      # scrape stays off so CI never hits live LSU.
      - name: Smoke-test server image
        run: |
          docker run -d --name api -p 127.0.0.1:3999:3000 \
            --add-host=host.docker.internal:host-gateway \
            -e DATABASE_URL=postgres://jevschedule:jevschedule@host.docker.internal:5432/jevschedule \
            -e SECTION_SCRAPE_ENABLED=false \
            jevschedule-server:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3999/health; then exit 0; fi
            sleep 1
          done
          echo "server image did not answer /health within 30s" >&2
          docker logs api
          exit 1

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
