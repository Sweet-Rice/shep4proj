name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://jevschedule:jevschedule@localhost:5432/jevschedule
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: jevschedule
          POSTGRES_PASSWORD: jevschedule
          POSTGRES_DB: jevschedule
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jevschedule -d jevschedule"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Needed so gitleaks can scan full history / the diff.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -r lint

      # Build before typecheck: consumers (apps/server, apps/desktop) import
      # @jevschedule/shared, and `tsc --noEmit` needs its built declaration
      # files to resolve the workspace dependency.
      - name: Build
        run: pnpm -r build

      - name: Prereq coverage report
        run: pnpm --filter @jevschedule/shared coverage:prereqs

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Migrate database
        run: pnpm --filter @jevschedule/server db:migrate

      - name: Seed database from fixtures
        run: pnpm --filter @jevschedule/server db:seed:fixtures

      - name: Test
        run: pnpm -r test

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
