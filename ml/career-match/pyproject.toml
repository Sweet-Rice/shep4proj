[project]
name = "career-match"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pytest>=9.1.1",
    "rapidfuzz>=3.14.6",
